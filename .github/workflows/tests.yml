name: tests

# Run the full pytest suite head-less on all three OSes, every push and PR. The standalone
# bundle builds and Releases live in the sibling repo (famc-liquid-foot-editor-builds), which
# checks this repo out at any ref and packages it — see docs/BUILD.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Qt/runtime system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libasound2 \
            libfontconfig1 libfreetype6 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout caps any single hung test (thread method works on Windows) so a stuck test
        # fails fast with a traceback instead of burning the whole job.
        run: python -m pytest -q --timeout=180 --timeout-method=thread
